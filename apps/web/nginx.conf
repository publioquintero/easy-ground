server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Screenshots/PDFs are processed in the browser; only JSON reaches the API.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Docker's DNS: re-resolve "api" so a recreated API container (new IP) doesn't 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API → FastAPI container (same origin, so no CORS needed).
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;

        # nginx's mime.types doesn't know .mjs; browsers refuse to run a module worker
        # (pdf.js) served as application/octet-stream.
        location ~* \.mjs$ {
            types { }
            default_type text/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # The app shell must always be fresh so updates reach the phone.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
